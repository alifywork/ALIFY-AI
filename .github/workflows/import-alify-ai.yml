name: Import ALIFY AI source

on:
  push:
    paths:
      - ".upload-parts/part-09.b64"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild plugin archive
        run: |
          cat .upload-parts/part-*.b64 | base64 --decode > /tmp/alify-ai.zip
          rm -rf /tmp/alify-ai-src
          mkdir -p /tmp/alify-ai-src
          unzip -q /tmp/alify-ai.zip -d /tmp/alify-ai-src
      - name: Replace repository with plugin source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .upload-parts -exec rm -rf {} +
          cp -a /tmp/alify-ai-src/alify-ai-connector/. .
          rm -rf .upload-parts
          rm -f .github/workflows/import-alify-ai.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ALIFY AI Connector v0.32.0"
          git push
